<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <title>RapidForge demos</title>
    <style>
      :root {
        --ground: #131313;
        --ink: #ecebe8;
        --muted: #a9a7a2;
      }

      body {
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
        background: var(--ground);
        color: var(--ink);
        font: 400 1.0625rem/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      main {
        max-width: 32rem;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
        line-height: 1.3;
      }

      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
      }

      a {
        color: var(--ink);
        text-underline-offset: 0.2em;
      }

      a:hover {
        text-decoration-thickness: 2px;
      }

      a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 4px;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>RapidForge demos</h1>
      <p>Nothing to see at this address — demo sites live on their own subdomains.</p>
      <a href="https://rapidforgeai.com">rapidforgeai.com</a>
    </main>
  </body>
</html>
