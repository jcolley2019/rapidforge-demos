<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scroll Story — minimal fixture</title>
    <link rel="stylesheet" href="scrollcraft.css" />
    <style>
      /* Three screens, no video: a pinned open, a flowing middle, a close.
         Just enough markup for the engine to drive; tests and local dev only. */
      :root {
        --sc-accent: #e8a317;
        --sc-accent-ink: #08090b;
      }
      /* .sc-stage pins (sticky, 100svh); only the ground and the centring are ours. */
      .sm-stage {
        display: grid;
        place-items: center;
        background: url('assets/open.svg') center / cover no-repeat var(--sc-canvas);
      }
      .sm-copy {
        padding: var(--sc-gutter);
        max-width: var(--sc-measure);
      }
      .sm-flow,
      .sm-close {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: var(--sc-section) var(--sc-gutter);
      }
      .sm-close {
        background: var(--sc-surface);
        text-align: center;
      }
      .sm-cta {
        display: inline-block;
        margin-top: var(--sc-6);
        padding: var(--sc-3) var(--sc-6);
        border-radius: var(--sc-r-pill);
        background: var(--sc-accent);
        color: var(--sc-accent-ink);
        font: 600 var(--sc-t-base) var(--sc-font-text);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <section data-sc-act="pin" data-sc-span="2" aria-label="Open">
        <div data-sc-stage class="sc-stage sm-stage">
          <div class="sm-copy" data-sc-cue="0.1 0.6 0.3">
            <h1 class="sc-display sc-display--lg" data-sc-kinetic="lines">One screen at a time.</h1>
            <p>A scroll-driven page: the wheel is the playhead.</p>
          </div>
        </div>
      </section>

      <section data-sc-act="flow" class="sm-flow" aria-label="Middle">
        <div class="sm-copy" data-sc-reveal="up" data-sc-reveal-at="0.1 0.5">
          <h2 class="sc-display sc-display--md">Your photos, your story.</h2>
          <p>Each act is one beat of the journey, and the reader sets the pace.</p>
        </div>
      </section>

      <section data-sc-act="flow" class="sm-close" aria-label="Close">
        <div class="sm-copy" data-sc-reveal="up" data-sc-reveal-at="0.1 0.5">
          <h2 class="sc-display sc-display--md">Ready when you are.</h2>
          <a class="sm-cta" href="tel:+15555550100">Call now</a>
        </div>
      </section>
    </main>
    <script src="scrollcraft.js"></script>
    <script>
      ScrollCraft.mount(document)
    </script>
  </body>
</html>
